<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出境旅游信息查询</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <h1 class="logo">🌍 出境旅游信息查询</h1>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="搜索国家..." class="search-input">
                    <button id="searchBtn" class="search-btn">搜索</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <div class="container">
                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">全部</button>
                    <button class="filter-tab" data-filter="asia">亚洲</button>
                    <button class="filter-tab" data-filter="europe">欧洲</button>
                    <button class="filter-tab" data-filter="america">美洲</button>
                    <button class="filter-tab" data-filter="africa">非洲</button>
                    <button class="filter-tab" data-filter="oceania">大洋洲</button>
                </div>

                <!-- Country Grid -->
                <div id="countryGrid" class="country-grid">
                    <!-- Countries will be loaded here -->
                </div>
            </div>
        </main>

        <!-- Country Detail Modal -->
        <div id="countryModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="countryDetail">
                    <!-- Country details will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p>&copy; 2024 出境旅游信息查询. 为您的出境之旅提供专业指导.</p>
            </div>
        </footer>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
